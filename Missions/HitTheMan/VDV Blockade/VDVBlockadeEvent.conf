 m_sDescription "A Soviet VDV Company has landed behind a US Brigade, cutting of Logistics and reinforcements while it is being attacked by the 17th Guard Regiment. They've had 16hrs to dig in and prepare before a response was made with a US Company with a attached Bradley and Mortars are rushing in to sweep the occupied forest to re-secure the MSR, to allow reinforcements and supply to reached the badly outnumbered US Brigade."
